<!doctype html>
<html lang="ru" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    
    .font-main {
      font-family: 'Space Grotesk', sans-serif;
    }
    
    .font-code {
      font-family: 'JetBrains Mono', monospace;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes confetti {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100px) rotate(720deg); opacity: 0; }
    }
    
    .animate-fade-in {
      animation: fadeIn 0.6s ease-out forwards;
    }
    
    .animate-slide-in {
      animation: slideIn 0.4s ease-out forwards;
    }
    
    .animate-bounce {
      animation: bounce 0.5s ease-out;
    }
    
    .animate-pulse-once {
      animation: pulse 0.3s ease-out;
    }
    
    .option-btn {
      transition: all 0.2s ease;
    }
    
    .option-btn:hover:not(:disabled) {
      transform: translateX(8px);
    }
    
    .correct-answer {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
      color: white !important;
      border-color: #059669 !important;
    }
    
    .wrong-answer {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;
      color: white !important;
      border-color: #dc2626 !important;
    }
    
    .progress-bar {
      transition: width 0.5s ease;
    }
    
    .snake-icon {
      animation: bounce 2s ease-in-out infinite;
    }
    
    .confetti-piece {
      position: absolute;
      animation: confetti 1s ease-out forwards;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full font-main">
  <div id="app" class="h-full w-full overflow-auto"></div>
  <script>
    const questions = [
      {
        id: 1,
        question: "В каком году был создан Python?",
        options: ["1991", "1985", "1886", "2013"],
        correct: 0
      },
      {
        id: 2,
        question: "Что такое программа?",
        options: [
          "Это коробка для хранения данных (чисел, текста и т.д)",
          "Это вид информации",
          "Это набор команд, которые компьютер выполняет по порядку",
          "Это блок кода"
        ],
        correct: 2
      },
      {
        id: 3,
        question: "Чтобы вывести результат на экран, используется встроенная функция:",
        options: ["float", "str", "print", "list"],
        correct: 2
      },
      {
        id: 4,
        question: "Сколько видов алгоритмов существует?",
        options: ["3", "4", "2", "6"],
        correct: 0
      },
      {
        id: 5,
        question: "Какую команду нужно выполнить, чтобы открыть новое окно в программе?",
        options: ["File > New file", "Save > File", "File > Save"],
        correct: 0
      },
      {
        id: 6,
        question: "Кем был создан язык программирования Python?",
        options: [
          "Биллом Гейтсом",
          "Линусом Торвальдсом",
          "Гвидо ван Россумом",
          "Марком Цукербергом"
        ],
        correct: 2
      },
      {
        id: 7,
        question: "Переменная int — это:",
        options: [
          "логическая переменная",
          "символьная строка",
          "вещественная переменная",
          "целая переменная"
        ],
        correct: 3
      },
      {
        id: 8,
        question: "a = 5, b = 7\na = int(input())\nb = int(input())\ns = a + b\nprint(s)\n\nЕсли ввести 5 и 7, что выведется?",
        options: ["11", "10", "8", "12"],
        correct: 3,
        isCode: true
      },
      {
        id: 9,
        question: "a = 5, b = 5\na = int(input())\nb = int(input())\ns = a + b\nprint(s)\n\nЕсли ввести 5 и 5, что выведется?",
        options: ["10", "0", "25", "15"],
        correct: 0,
        isCode: true
      },
      {
        id: 10,
        question: "a = 20\nb = a + 5\na = b * 100\nprint(a)\n\nЧто будет в результате?",
        options: ["25", "250", "2500", "2000"],
        correct: 2,
        isCode: true
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;
    let gameStarted = false;

    const defaultConfig = {
      quiz_title: "Викторина по Python",
      start_button_text: "Начать игру",
      background_color: "#0f172a",
      surface_color: "#1e293b",
      text_color: "#f8fafc",
      primary_action_color: "#3b82f6",
      secondary_action_color: "#6366f1",
      font_family: "Space Grotesk",
      font_size: 16
    };

    let config = { ...defaultConfig };

    function renderStartScreen() {
      const app = document.getElementById('app');
      const customFont = config.font_family || defaultConfig.font_family;
      const baseSize = config.font_size || defaultConfig.font_size;
      
      app.innerHTML = `
        <div class="min-h-full w-full flex items-center justify-center p-6" style="background: linear-gradient(135deg, ${config.background_color} 0%, #1a1a2e 50%, ${config.surface_color} 100%); font-family: '${customFont}', sans-serif;">
          <div class="text-center animate-fade-in max-w-lg w-full">
            <div class="snake-icon text-8xl mb-6">🐍</div>
            <h1 id="title-text" class="text-4xl md:text-5xl font-bold mb-4" style="color: ${config.text_color}; font-size: ${baseSize * 2.5}px;">${config.quiz_title}</h1>
            <p class="text-xl mb-8 opacity-80" style="color: ${config.text_color}; font-size: ${baseSize * 1.25}px;">Проверь свои знания!</p>
            <div class="mb-8 p-4 rounded-xl" style="background: ${config.surface_color};">
              <p class="text-lg" style="color: ${config.text_color}; font-size: ${baseSize}px;">📝 10 вопросов</p>
              <p class="text-lg mt-2" style="color: ${config.text_color}; font-size: ${baseSize}px;">⏱️ 30 секунд на вопрос</p>
              <p class="text-lg mt-2" style="color: ${config.text_color}; font-size: ${baseSize}px;">🏆 Набери максимум баллов!</p>
            </div>
            <button id="start-btn" onclick="startGame()" class="px-8 py-4 rounded-xl text-xl font-bold text-white transition-all hover:scale-105 hover:shadow-2xl" style="background: linear-gradient(135deg, ${config.primary_action_color} 0%, ${config.secondary_action_color} 100%); font-size: ${baseSize * 1.25}px;">
              ${config.start_button_text} 🚀
            </button>
          </div>
        </div>
      `;
    }

    function startGame() {
      gameStarted = true;
      currentQuestion = 0;
      score = 0;
      renderQuestion();
    }

    function renderQuestion() {
      answered = false;
      const q = questions[currentQuestion];
      const app = document.getElementById('app');
      const progress = ((currentQuestion) / questions.length) * 100;
      const customFont = config.font_family || defaultConfig.font_family;
      const baseSize = config.font_size || defaultConfig.font_size;
      
      let questionText = q.question;
      if (q.isCode) {
        const parts = q.question.split('\n\n');
        const code = parts[0];
        const text = parts[1] || '';
        questionText = `<pre class="font-code text-left p-4 rounded-lg mb-4 text-sm overflow-x-auto" style="background: ${config.background_color}; color: #a5f3fc;">${code}</pre><p style="font-size: ${baseSize}px;">${text}</p>`;
      }
      
      app.innerHTML = `
        <div class="min-h-full w-full flex flex-col p-4 md:p-6" style="background: linear-gradient(135deg, ${config.background_color} 0%, #1a1a2e 100%); font-family: '${customFont}', sans-serif;">
          <!-- Header -->
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
              <span class="text-3xl">🐍</span>
              <span class="font-bold" style="color: ${config.text_color}; font-size: ${baseSize}px;">Python Quiz</span>
            </div>
            <div class="flex items-center gap-2 px-4 py-2 rounded-full" style="background: ${config.surface_color};">
              <span style="font-size: ${baseSize}px;">🏆</span>
              <span class="font-bold" style="color: ${config.primary_action_color}; font-size: ${baseSize}px;">${score}</span>
            </div>
          </div>
          
          <!-- Progress -->
          <div class="mb-6">
            <div class="flex justify-between mb-2" style="color: ${config.text_color};">
              <span style="font-size: ${baseSize * 0.875}px;">Вопрос ${currentQuestion + 1} из ${questions.length}</span>
              <span style="font-size: ${baseSize * 0.875}px;">${Math.round(progress)}%</span>
            </div>
            <div class="h-3 rounded-full overflow-hidden" style="background: ${config.surface_color};">
              <div class="h-full progress-bar rounded-full" style="width: ${progress}%; background: linear-gradient(90deg, ${config.primary_action_color} 0%, ${config.secondary_action_color} 100%);"></div>
            </div>
          </div>
          
          <!-- Question Card -->
          <div class="flex-1 flex flex-col">
            <div class="p-6 rounded-2xl mb-6 animate-fade-in" style="background: ${config.surface_color};">
              <div class="text-xl md:text-2xl font-semibold" style="color: ${config.text_color}; font-size: ${baseSize * 1.25}px;">
                ${questionText}
              </div>
            </div>
            
            <!-- Options -->
            <div class="space-y-3" id="options-container">
              ${q.options.map((opt, i) => `
                <button 
                  onclick="selectAnswer(${i})" 
                  class="option-btn w-full p-4 rounded-xl text-left font-medium border-2 animate-slide-in"
                  style="animation-delay: ${i * 0.1}s; background: ${config.surface_color}; border-color: #374151; color: ${config.text_color}; font-size: ${baseSize}px;"
                  data-index="${i}"
                >
                  <span class="inline-flex items-center justify-center w-8 h-8 rounded-full mr-3 text-sm font-bold" style="background: ${config.primary_action_color}; color: white;">
                    ${String.fromCharCode(65 + i)}
                  </span>
                  ${opt}
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function selectAnswer(index) {
      if (answered) return;
      answered = true;
      
      const q = questions[currentQuestion];
      const buttons = document.querySelectorAll('.option-btn');
      const isCorrect = index === q.correct;
      
      buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.correct) {
          btn.classList.add('correct-answer');
        } else if (i === index && !isCorrect) {
          btn.classList.add('wrong-answer');
        }
      });
      
      if (isCorrect) {
        score++;
        createConfetti();
      }
      
      setTimeout(() => {
        if (currentQuestion < questions.length - 1) {
          currentQuestion++;
          renderQuestion();
        } else {
          renderResults();
        }
      }, 1500);
    }

    function createConfetti() {
      const colors = ['#3b82f6', '#6366f1', '#10b981', '#f59e0b', '#ef4444'];
      const container = document.getElementById('app');
      
      for (let i = 0; i < 20; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti-piece';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.top = '20%';
        confetti.style.width = '10px';
        confetti.style.height = '10px';
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        container.appendChild(confetti);
        
        setTimeout(() => confetti.remove(), 1500);
      }
    }

    function renderResults() {
      const app = document.getElementById('app');
      const percentage = (score / questions.length) * 100;
      const customFont = config.font_family || defaultConfig.font_family;
      const baseSize = config.font_size || defaultConfig.font_size;
      
      let emoji, message;
      if (percentage >= 90) {
        emoji = '🏆';
        message = 'Превосходно! Ты настоящий Python-мастер!';
      } else if (percentage >= 70) {
        emoji = '🌟';
        message = 'Отлично! Хорошие знания Python!';
      } else if (percentage >= 50) {
        emoji = '👍';
        message = 'Неплохо! Есть над чем поработать.';
      } else {
        emoji = '📚';
        message = 'Нужно больше практики! Не сдавайся!';
      }
      
      app.innerHTML = `
        <div class="min-h-full w-full flex items-center justify-center p-6" style="background: linear-gradient(135deg, ${config.background_color} 0%, #1a1a2e 50%, ${config.surface_color} 100%); font-family: '${customFont}', sans-serif;">
          <div class="text-center animate-fade-in max-w-lg w-full">
            <div class="text-8xl mb-6 animate-bounce">${emoji}</div>
            <h2 class="text-3xl md:text-4xl font-bold mb-4" style="color: ${config.text_color}; font-size: ${baseSize * 2}px;">Викторина завершена!</h2>
            <p class="text-xl mb-8 opacity-90" style="color: ${config.text_color}; font-size: ${baseSize * 1.25}px;">${message}</p>
            
            <div class="p-6 rounded-2xl mb-8" style="background: ${config.surface_color};">
              <div class="text-6xl font-bold mb-2" style="color: ${config.primary_action_color}; font-size: ${baseSize * 3}px;">${score}/${questions.length}</div>
              <p style="color: ${config.text_color}; font-size: ${baseSize}px;">правильных ответов</p>
              <div class="mt-4 h-4 rounded-full overflow-hidden" style="background: ${config.background_color};">
                <div class="h-full rounded-full transition-all duration-1000" style="width: ${percentage}%; background: linear-gradient(90deg, ${config.primary_action_color} 0%, ${config.secondary_action_color} 100%);"></div>
              </div>
              <p class="mt-2 font-semibold" style="color: ${config.secondary_action_color}; font-size: ${baseSize}px;">${Math.round(percentage)}%</p>
            </div>
            
            <button onclick="restartGame()" class="px-8 py-4 rounded-xl text-xl font-bold text-white transition-all hover:scale-105" style="background: linear-gradient(135deg, ${config.primary_action_color} 0%, ${config.secondary_action_color} 100%); font-size: ${baseSize * 1.25}px;">
              Играть снова 🔄
            </button>
          </div>
        </div>
      `;
    }

    function restartGame() {
      gameStarted = false;
      currentQuestion = 0;
      score = 0;
      renderStartScreen();
    }

    async function onConfigChange(newConfig) {
      config = { ...defaultConfig, ...newConfig };
      if (gameStarted) {
        if (currentQuestion >= questions.length) {
          renderResults();
        } else {
          renderQuestion();
        }
      } else {
        renderStartScreen();
      }
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => { config.background_color = value; window.elementSdk.setConfig({ background_color: value }); }
          },
          {
            get: () => config.surface_color || defaultConfig.surface_color,
            set: (value) => { config.surface_color = value; window.elementSdk.setConfig({ surface_color: value }); }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => { config.text_color = value; window.elementSdk.setConfig({ text_color: value }); }
          },
          {
            get: () => config.primary_action_color || defaultConfig.primary_action_color,
            set: (value) => { config.primary_action_color = value; window.elementSdk.setConfig({ primary_action_color: value }); }
          },
          {
            get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
            set: (value) => { config.secondary_action_color = value; window.elementSdk.setConfig({ secondary_action_color: value }); }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (value) => { config.font_family = value; window.elementSdk.setConfig({ font_family: value }); }
        },
        fontSizeable: {
          get: () => config.font_size || defaultConfig.font_size,
          set: (value) => { config.font_size = value; window.elementSdk.setConfig({ font_size: value }); }
        }
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ["quiz_title", config.quiz_title || defaultConfig.quiz_title],
        ["start_button_text", config.start_button_text || defaultConfig.start_button_text]
      ]);
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    } else {
      renderStartScreen();
    }
  </script>

</html>
